<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- CutPilot Vector Logo -->
  <defs>
    <linearGradient id="logoBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1C23" />
      <stop offset="100%" stop-color="#0E0F13" />
    </linearGradient>
    <linearGradient id="logoClipLeft" x1="13" y1="12" x2="21" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9E90FF" />
      <stop offset="100%" stop-color="#7662EA" />
    </linearGradient>
    <linearGradient id="logoClipRight" x1="24" y1="18" x2="36" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DBD4FF" />
      <stop offset="100%" stop-color="#AEA0FF" />
    </linearGradient>
    <filter id="softGlow" x="16" y="4" width="16" height="16" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#8B7CF6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Charcoal Tile with Subtle Border -->
  <rect width="48" height="48" rx="11" fill="url(#logoBg)" />
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="10.25" stroke="#2B2F38" stroke-width="1.5" />

  <!-- Left timeline clip (Source) -->
  <path d="M 14 13.5 C 13.3 14 13 14.7 13 15.5 V 32.5 C 13 33.3 13.3 34 14 34.5 L 21 31.2 V 16.8 Z" fill="url(#logoClipLeft)" />

  <!-- Right timeline clip (Cut / Draft) -->
  <path d="M 24 17.8 L 35.5 23.2 C 36.3 23.6 36.3 24.4 35.5 24.8 L 24 30.2 Z" fill="url(#logoClipRight)" />

  <!-- Playhead indicator and needle -->
  <g filter="url(#softGlow)">
    <path d="M 18.5 7 H 26.5 V 10.5 L 22.5 14 L 18.5 10.5 Z" fill="#F3EFFF" />
  </g>
  <line x1="22.5" y1="14" x2="22.5" y2="34.5" stroke="#F3EFFF" stroke-width="1.75" stroke-linecap="round" opacity="0.95" />
</svg>
